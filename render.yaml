services:
  # Backend Web Service (Spring Boot + Java 21)
  - type: web
    name: finpath-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/public/stats
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: finpath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finpath-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finpath-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: finpath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finpath-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # Frontend Static Site (React + Vite)
  - type: web
    name: finpath-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: finpath-db
    databaseName: finpath
    user: finpath
    plan: free
    region: oregon
