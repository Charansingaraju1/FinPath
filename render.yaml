services:
  # Backend Web Service (Spring Boot + Java 21)
  - type: web
    name: finpath-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: finpath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finpath-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finpath-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: finpath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finpath-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://frontend-five-wine-48.vercel.app"
